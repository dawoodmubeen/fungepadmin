<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNGEP Admin Dashboard</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Script for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue
                        secondary: '#1e40af', // Darker blue
                        background: '#f8fafc',
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        .page-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 12% 12%, rgba(255,255,255,0.64), transparent 28rem),
                radial-gradient(circle at 88% 8%, rgba(191,219,254,0.8), transparent 22rem),
                linear-gradient(135deg, #00adef 0%, #0076e5 100%);
        }
        .page-bg::after {
            content: "";
            position: absolute;
            inset: auto -12rem -22rem auto;
            width: 44rem;
            height: 44rem;
            border-radius: 50%;
            background: rgba(255,255,255,0.16);
        }
        .glass-card {
            border: 1px solid rgba(255,255,255,0.72); 
            border-radius: 28px; 
            background: rgba(255,255,255,0.94); 
            padding: 2.5rem; 
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            position: relative; 
            overflow: hidden;
        }
        .glass-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 32px 80px rgba(15, 23, 42, 0.18); 
        }
        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 54px;
            border: 0;
            border-radius: 999px;
            padding: 0 32px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e293b;
            background: #ffffff;
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            width: 100%;
        }
        .btn-google:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15); 
            background: #f8fafc;
        }
    </style>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="text-gray-800 font-sans antialiased relative">
    <div class="page-bg" aria-hidden="true"></div>

    <!-- App Container -->
    <div id="app" class="min-h-screen flex hidden relative z-10">
        <!-- Sidebar -->
        <aside id="sidebar-container" class="w-64 bg-surface/90 backdrop-blur-xl border-r border-gray-200/50 hidden md:block flex-shrink-0 flex flex-col h-screen sticky top-0 z-40 shadow-xl"></aside>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 hidden md:hidden"></div>
        <aside id="mobile-sidebar-container" class="fixed inset-y-0 left-0 w-64 bg-surface/90 backdrop-blur-xl border-r border-gray-200/50 z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-xl"></aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Header -->
            <header id="header-container" class="h-16 bg-surface/80 backdrop-blur-md border-b border-gray-200/50 flex items-center justify-between px-4 sticky top-0 z-30"></header>
            
            <!-- Main View Area -->
            <main id="main-view" class="flex-1 p-4 md:p-6 overflow-y-auto"></main>
        </div>
    </div>

    <!-- Login View (Shown when not authenticated) -->
    <div id="login-view" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 hidden relative z-10">
        <div class="max-w-md w-full glass-card text-center space-y-8">
            <div>
                <div class="mx-auto w-20 h-20 bg-gradient-to-tr from-blue-500 to-blue-300 rounded-2xl shadow-lg flex items-center justify-center mb-6">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Admin Portal</h2>
                <p class="mt-3 text-base text-gray-500">Secure access for authorized personnel only</p>
            </div>
            <div class="mt-8 text-left">
                <form id="email-login-form" class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="email" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:ring-primary focus:border-primary sm:text-sm">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:ring-primary focus:border-primary sm:text-sm">
                    </div>
                    <button type="submit" id="login-submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-base font-bold text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors mt-6">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Unauthorized State -->
    <div id="unauthorized-view" class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 hidden relative z-10">
        <div class="max-w-md w-full glass-card text-center space-y-6">
            <div class="mx-auto w-20 h-20 bg-red-100 rounded-2xl flex items-center justify-center mb-4">
                <i data-lucide="shield-alert" class="h-10 w-10 text-red-500"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Access Denied</h2>
            <p class="text-base text-gray-500">You don't have permission to access FUNGEP Admin.</p>
            <div class="mt-8">
                <button id="logout-btn-unauth" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition-colors">
                    Return to Login
                </button>
            </div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Appwrite SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    
    <!-- Main Module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
