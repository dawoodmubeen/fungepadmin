<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNGEP Admin Dashboard</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Script for development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#2563eb', // Blue
                        secondary: '#1e40af', // Darker blue
                        background: '#f8fafc',
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-background text-gray-800 font-sans antialiased">
    <!-- App Container -->
    <div id="app" class="min-h-screen flex hidden">
        <!-- Sidebar -->
        <aside id="sidebar-container" class="w-64 bg-surface border-r border-gray-200 hidden md:block flex-shrink-0 flex flex-col h-screen sticky top-0 z-40"></aside>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 hidden md:hidden"></div>
        <aside id="mobile-sidebar-container" class="fixed inset-y-0 left-0 w-64 bg-surface border-r border-gray-200 z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col"></aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Header -->
            <header id="header-container" class="h-16 bg-surface border-b border-gray-200 flex items-center justify-between px-4 sticky top-0 z-30"></header>
            
            <!-- Main View Area -->
            <main id="main-view" class="flex-1 p-4 md:p-6 overflow-y-auto"></main>
        </div>
    </div>

    <!-- Login View (Shown when not authenticated) -->
    <div id="login-view" class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 hidden">
        <div class="max-w-md w-full space-y-8 bg-surface p-8 rounded-xl shadow-lg border border-gray-100">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">FUNGEP Admin</h2>
                <p class="mt-2 text-center text-sm text-gray-600">Sign in to access the dashboard</p>
            </div>
            <div class="mt-8">
                <button id="google-login-btn" class="group relative w-full flex justify-center py-3 px-4 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                    </span>
                    Sign in with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Initial Loading State -->
    <div id="initial-loading" class="min-h-screen flex flex-col items-center justify-center bg-gray-50">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mb-4"></div>
        <p class="text-gray-500 font-medium">Initializing Dashboard...</p>
    </div>

    <!-- Unauthorized State -->
    <div id="unauthorized-view" class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8 hidden">
        <div class="max-w-md w-full space-y-8 bg-surface p-8 rounded-xl shadow-lg border border-red-100 text-center">
            <i data-lucide="shield-alert" class="mx-auto h-16 w-16 text-red-500"></i>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Access Denied</h2>
            <p class="mt-2 text-sm text-gray-600">You don't have permission to access FUNGEP Admin.</p>
            <div class="mt-8">
                <button id="logout-btn-unauth" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Return to Login
                </button>
            </div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Appwrite SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    
    <!-- Main Module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
