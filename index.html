<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNGEP Admin Dashboard | Enterprise Portal</title>
    <link rel="icon" type="image/png" href="assets/funglogo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (with CDN notice suppressor) -->
    <script>
        // Suppress Tailwind Play CDN notice in browser console
        (function() {
            const _origWarn = console.warn;
            console.warn = function(...args) {
                if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
                _origWarn.apply(console, args);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#00adef', // Signature FUNGEP brand cyan
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            500: '#00adef',
                            600: '#0090d0',
                            700: '#0076e5',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        navy: {
                            800: '#0f172a',
                            900: '#0b1120',
                        },
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen selection:bg-sky-500 selection:text-white">
    <!-- Exact User Dashboard Signature Background -->
    <div class="page-bg" aria-hidden="true"></div>

    <!-- App Container -->
    <div id="app" class="min-h-screen flex hidden relative">
        <!-- Desktop Sidebar -->
        <aside id="sidebar-container" class="w-72 bg-white/95 backdrop-blur-xl border-r border-slate-200/80 hidden lg:flex flex-col h-screen sticky top-0 z-40 shadow-sm transition-all duration-300"></aside>
        
        <!-- Mobile Sidebar Overlay & Off-canvas Drawer -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-opacity"></div>
        <aside id="mobile-sidebar-container" class="fixed inset-y-0 left-0 w-72 bg-white/95 backdrop-blur-2xl border-r border-slate-200 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out lg:hidden flex flex-col shadow-2xl"></aside>

        <!-- Main Content Column -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Global Sticky Header -->
            <header id="header-container" class="h-16 bg-white/85 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30"></header>
            
            <!-- Dynamic Routed Main View Area -->
            <main id="main-view" class="flex-1 p-4 sm:p-6 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full"></main>
        </div>
    </div>

    <!-- Login View (Shown when unauthenticated) -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 hidden relative z-10">
        <div class="w-full max-w-md bg-white/90 backdrop-blur-2xl rounded-3xl p-8 sm:p-10 shadow-2xl border border-white/80 ring-1 ring-slate-900/5">
            <!-- Brand Logo & Title -->
            <div class="text-center">
                <div class="inline-block p-2 bg-white rounded-2xl shadow-md border border-slate-100 mb-4">
                    <img src="assets/funglogo.png" alt="FUNGEP Logo" class="w-20 h-20 object-contain mx-auto">
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">FUNGEP Admin</h1>
                <p class="text-sm font-medium text-slate-500 mt-1">Enterprise Administration & Exam Engine</p>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sky-50 text-sky-700 text-xs font-semibold mt-3">
                    <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span>
                    Platform v2.0 Enterprise
                </div>
            </div>

            <!-- Login Form -->
            <form id="email-login-form" class="mt-8 space-y-4">
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Admin Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="email" id="email" required placeholder="admin@fungep.com" 
                            class="w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all font-medium">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="password" required placeholder="••••••••••••" 
                            class="w-full pl-11 pr-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all font-medium">
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" 
                    class="w-full mt-2 flex items-center justify-center gap-2 py-3 px-4 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 text-white font-bold rounded-xl shadow-lg shadow-sky-500/25 hover:shadow-sky-500/40 transition-all duration-200 text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 active:scale-[0.98]">
                    <span>Authenticate & Access</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400">Restricted console. Unauthorized access attempts are monitored and logged.</p>
            </div>
        </div>
    </div>

    <!-- Unauthorized Access Warning State -->
    <div id="unauthorized-view" class="min-h-screen flex items-center justify-center p-4 hidden relative z-10">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 text-center shadow-2xl border border-rose-100">
            <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-500 mx-auto flex items-center justify-center mb-4">
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Access Restricted</h2>
            <p class="text-slate-600 text-sm mt-2">Your account does not possess administrator role permissions for the FUNGEP Admin Console.</p>
            <button id="logout-btn-unauth" class="mt-6 w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-semibold transition">
                Sign Out & Switch Account
            </button>
        </div>
    </div>

    <!-- Dynamic Modals Container -->
    <div id="modals-container"></div>
    
    <!-- Toast Notifications Floating Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Appwrite SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    
    <!-- Main Application Module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
